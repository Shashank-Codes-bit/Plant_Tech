# Backend CI/CD: test, then deploy to the shared Oracle VM.
#   push to staging -> https://nurserypos-staging.140-238-251-141.sslip.io
#   push to main    -> https://nurserypos.140-238-251-141.sslip.io
# The deploy key (secret NURSERYPOS_DEPLOY_KEY) is locked on the VM to a forced command
# that can only run "staging" or "prod" (see deploy/ci-deploy); it never gets a shell.
name: Backend deploy

on:
  push:
    branches: [staging, main]
    paths: ["backend/**", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Offline smoke test (fake Claude, in-memory Mongo)
        working-directory: backend
        run: python -m pytest -n 0 tests/test_smoke_mocked.py -q

  deploy:
    needs: test
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      SITE: ${{ github.ref_name == 'main' && 'https://nurserypos.140-238-251-141.sslip.io' || 'https://nurserypos-staging.140-238-251-141.sslip.io' }}
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.NURSERYPOS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned host key of svc-agent (SHA256:Ea/CDbX1gZSMVazDLeRRg2xjr/J+7559WJl8D3YHSDA)
          echo "140.238.251.141 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPIbRpwV5dkKYlpMRf4pjYsUviDks7pqrOmQmHgBNbmA" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@140.238.251.141 "$TARGET"
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$SITE/health"
