# Run from this folder on the VM:  DOMAIN=nurserypos.duckdns.org docker compose up -d --build
services:
  api:
    build: ../backend
    env_file: ../backend/.env
    volumes:
      - uploads:/data/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    # no ports: only reachable from the api container

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
  caddy-data:
  caddy-config:
